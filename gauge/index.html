<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Profit Margin Gauge</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #gauge-root { box-sizing: border-box; width: 100%; height: 100%; display: flex;
    align-items: center; justify-content: center; position: relative; }
</style>
</head>
<body>
<div id="gauge-root">
  <svg id="gauge-svg" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/@sigmacomputing/plugin@1.2.0/dist/umd/sigmacomputing-plugin.umd.js"></script>
<script>
(function () {
  'use strict';

  function synth() { return { value: 42, target: 100, label: 'Profit Margin' }; }

  function polarPoint(cx, cy, r, deg) {
    var rad = ((deg - 180) * Math.PI) / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }

  function arcPath(cx, cy, r, startDeg, endDeg) {
    var start = polarPoint(cx, cy, r, endDeg);
    var end = polarPoint(cx, cy, r, startDeg);
    var large = (endDeg - startDeg) <= 180 ? 0 : 1;
    return ['M', start.x, start.y, 'A', r, r, 0, large, 0, end.x, end.y].join(' ');
  }

  function ragColor(frac) {
    if (frac >= 0.5) return '#22c55e';
    if (frac >= 0.3) return '#eab308';
    return '#ef4444';
  }

  var lastValue = null, lastTarget = null, lastLabel = '';

  function render(value, target, label) {
    lastValue = value; lastTarget = target; lastLabel = label || 'Metric';
    var root = document.getElementById('gauge-root');
    var svg = document.getElementById('gauge-svg');
    var box = root.getBoundingClientRect();
    var w = Math.max(80, box.width), h = Math.max(60, box.height);
    svg.setAttribute('width', w); svg.setAttribute('height', h);
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);

    var frac = target > 0 ? Math.max(0, Math.min(1, value / target)) : 0;
    var color = ragColor(frac);
    var pct = (frac * 100).toFixed(1) + '%';

    var cx = w / 2;
    var strokeWidth = Math.max(6, Math.min(w, h * 1.6) * 0.1);
    var pad = strokeWidth / 2 + 4;
    var cy = Math.min(h - pad - 16, h * 0.72);
    var r = Math.max(12, Math.min(w / 2 - pad, cy - pad - 16));
    var valueFontSize = Math.max(14, Math.min(w * 0.14, h * 0.28));
    var labelFontSize = Math.max(9, valueFontSize * 0.35);
    var subFontSize = Math.max(8, valueFontSize * 0.28);

    svg.innerHTML =
      // Track
      '<path d="' + arcPath(cx, cy, r, 0, 180) + '" stroke="#334155" stroke-width="' + strokeWidth + '" fill="none" stroke-linecap="round"/>' +
      // Fill
      '<path d="' + arcPath(cx, cy, r, 0, 180 * frac) + '" stroke="' + color + '" stroke-width="' + strokeWidth + '" fill="none" stroke-linecap="round"/>' +
      // Label above arc
      '<text x="' + cx + '" y="' + Math.max(labelFontSize + 4, cy - r - 8) + '" text-anchor="middle" font-size="' + labelFontSize + '" font-weight="600" fill="#94a3b8" letter-spacing="1.5" text-transform="uppercase">' + label.toUpperCase() + '</text>' +
      // Percentage value
      '<text x="' + cx + '" y="' + (cy - r * 0.1) + '" text-anchor="middle" font-size="' + valueFontSize + '" font-weight="700" fill="#ffffff">' + pct + '</text>' +
      // Descriptive subtitle
      '<text x="' + cx + '" y="' + (cy - r * 0.1 + subFontSize + 6) + '" text-anchor="middle" font-size="' + subFontSize + '" fill="#64748b">of Revenue</text>' +
      // Min/max labels at arc ends
      '<text x="' + (cx - r) + '" y="' + (cy + subFontSize + 8) + '" text-anchor="middle" font-size="' + (subFontSize - 1) + '" fill="#475569">0%</text>' +
      '<text x="' + (cx + r) + '" y="' + (cy + subFontSize + 8) + '" text-anchor="middle" font-size="' + (subFontSize - 1) + '" fill="#475569">100%</text>';
  }

  var s = synth();
  render(s.value, s.target, s.label);

  var client = (window.SigmaPlugin && window.SigmaPlugin.client) || null;
  if (client) {
    client.config.configureEditorPanel([
      { name: 'source', type: 'element' },
      { name: 'value', type: 'column', source: 'source', allowMultiple: false },
      { name: 'target', type: 'column', source: 'source', allowMultiple: false },
      { name: 'label', type: 'text', defaultValue: 'Profit Margin', placeholder: 'Gauge title' }
    ]);
    var unsubData = null;
    client.config.subscribe(function (config) {
      var sourceId = config && config.source;
      if (unsubData) { unsubData(); unsubData = null; }
      if (!sourceId) { var fb = synth(); render(fb.value, fb.target, (config && config.label) || fb.label); return; }
      unsubData = client.elements.subscribeToElementData(sourceId, function (data) {
        try {
          var v = data[config.value], t = data[config.target];
          if (v && v.length && t && t.length) {
            render(Number(v[0]), Number(t[0]), config.label || 'Metric');
          } else { var fb = synth(); render(fb.value, fb.target, config.label || fb.label); }
        } catch (e) { var fb = synth(); render(fb.value, fb.target, fb.label); }
      });
    });
  }

  new ResizeObserver(function () {
    var v = lastValue === null ? synth().value : lastValue;
    var t = lastTarget === null ? synth().target : lastTarget;
    render(v, t, lastLabel);
  }).observe(document.getElementById('gauge-root'));
})();
</script>
</body>
</html>
