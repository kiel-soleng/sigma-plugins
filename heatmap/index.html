<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>US Sales Heatmap</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #root { width: 100%; height: 100%; position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
  #title { position: absolute; top: 8px; left: 12px; font-size: 11px; font-weight: 600;
    color: #475569; letter-spacing: 1.2px; text-transform: uppercase; }
  #tooltip { position: fixed; background: #1e293b; color: #e2e8f0; padding: 8px 12px;
    border-radius: 6px; font-size: 12px; pointer-events: none; display: none; z-index: 100;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4); line-height: 1.5; }
  #legend { position: absolute; bottom: 8px; left: 12px; display: flex; align-items: center;
    gap: 4px; font-size: 10px; color: #475569; }
  #legend .bar { width: 120px; height: 10px; border-radius: 3px; }
</style>
</head>
<body>
<div id="root">
  <div id="title">US SALES BY STORE LOCATION</div>
  <canvas id="map"></canvas>
  <div id="tooltip"></div>
  <div id="legend">
    <span>Low</span>
    <div class="bar" style="background: linear-gradient(to right, #1e3a5f, #3b82f6, #60a5fa, #fbbf24, #ef4444);"></div>
    <span>High</span>
  </div>
</div>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/@sigmacomputing/plugin@1.2.0/dist/umd/sigmacomputing-plugin.umd.js"></script>
<script>
(function () {
  'use strict';

  // Albers-like projection for contiguous US (simplified)
  function project(lat, lng, w, h) {
    var cx = -98.5, cy = 39.5; // center of contiguous US
    var scale = Math.min(w, h * 1.8) * 1.2;
    var x = (lng - cx) * Math.cos(cy * Math.PI / 180) * (scale / 70) + w / 2;
    var y = -(lat - cy) * (scale / 70) + h / 2 - h * 0.05;
    return { x: x, y: y };
  }

  // Simple US outline (contiguous 48 boundary approximation)
  var US_OUTLINE = [
    [-124.7, 48.4], [-123.0, 48.4], [-122.8, 49.0], [-117.0, 49.0], [-116.0, 49.0],
    [-104.0, 49.0], [-97.0, 49.0], [-95.1, 49.0], [-89.0, 48.0], [-84.0, 46.5],
    [-82.5, 46.0], [-82.5, 43.0], [-79.0, 43.2], [-76.8, 43.6], [-75.0, 45.0],
    [-71.0, 45.0], [-67.0, 44.8], [-67.0, 43.0], [-70.0, 42.0], [-71.0, 41.5],
    [-72.0, 41.0], [-74.0, 40.5], [-74.0, 39.5], [-75.5, 39.0], [-75.5, 38.5],
    [-76.0, 37.5], [-76.0, 36.5], [-75.5, 35.5], [-77.0, 34.5], [-79.0, 33.5],
    [-80.5, 32.0], [-81.0, 31.0], [-81.5, 30.5], [-84.0, 30.0], [-85.0, 29.5],
    [-87.5, 30.0], [-88.5, 30.0], [-89.5, 29.0], [-89.5, 28.5], [-91.0, 29.0],
    [-93.5, 29.5], [-94.5, 29.0], [-97.0, 26.0], [-97.5, 25.8], [-99.0, 26.5],
    [-103.0, 29.0], [-104.5, 29.5], [-106.5, 31.8], [-108.0, 31.3], [-111.0, 31.3],
    [-114.8, 32.5], [-117.2, 32.5], [-118.5, 34.0], [-120.5, 34.5], [-121.0, 36.5],
    [-122.5, 37.8], [-123.0, 39.0], [-124.0, 40.0], [-124.5, 42.0], [-124.5, 46.0],
    [-124.7, 48.4]
  ];

  function synth() {
    var stores = [];
    var lats = [40.7, 34.0, 41.9, 29.8, 33.4, 47.6, 39.7, 25.8, 38.9, 35.2,
                42.4, 37.8, 30.3, 32.7, 36.2, 44.0, 39.1, 43.0, 35.5, 33.5];
    var lngs = [-74.0, -118.2, -87.6, -95.4, -112.0, -122.3, -104.9, -80.2, -77.0, -80.8,
                -71.1, -122.4, -97.7, -117.2, -86.8, -123.0, -84.5, -89.4, -97.5, -84.4];
    var names = ['New York','Los Angeles','Chicago','Houston','Phoenix','Seattle','Denver',
                 'Miami','Washington DC','Charlotte','Boston','San Francisco','Austin',
                 'San Diego','Nashville','Portland','Cincinnati','Milwaukee','Oklahoma City','Atlanta'];
    for (var i = 0; i < 20; i++) {
      stores.push({ lat: lats[i], lng: lngs[i], value: Math.random() * 500000 + 50000, name: names[i] });
    }
    return stores;
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  function heatColor(frac) {
    // blue -> light blue -> yellow -> red
    if (frac < 0.33) {
      var t = frac / 0.33;
      return 'rgb(' + Math.round(lerp(30, 59, t)) + ',' + Math.round(lerp(58, 130, t)) + ',' + Math.round(lerp(95, 246, t)) + ')';
    } else if (frac < 0.66) {
      var t = (frac - 0.33) / 0.33;
      return 'rgb(' + Math.round(lerp(59, 251, t)) + ',' + Math.round(lerp(130, 191, t)) + ',' + Math.round(lerp(246, 36, t)) + ')';
    } else {
      var t = (frac - 0.66) / 0.34;
      return 'rgb(' + Math.round(lerp(251, 239, t)) + ',' + Math.round(lerp(191, 68, t)) + ',' + Math.round(lerp(36, 68, t)) + ')';
    }
  }

  var canvas, ctx, storeData = [], lastW = 0, lastH = 0;
  var tooltip = document.getElementById('tooltip');

  function render(stores) {
    storeData = stores;
    canvas = document.getElementById('map');
    var root = document.getElementById('root');
    var box = root.getBoundingClientRect();
    var w = Math.max(200, box.width), h = Math.max(120, box.height);
    canvas.width = w * 2; canvas.height = h * 2; // retina
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx = canvas.getContext('2d');
    ctx.scale(2, 2);
    lastW = w; lastH = h;

    // Draw US outline
    ctx.beginPath();
    for (var i = 0; i < US_OUTLINE.length; i++) {
      var p = project(US_OUTLINE[i][1], US_OUTLINE[i][0], w, h);
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.fillStyle = '#F1F5F9';
    ctx.fill();
    ctx.strokeStyle = '#CBD5E1';
    ctx.lineWidth = 1;
    ctx.stroke();

    if (!stores.length) return;

    var vals = stores.map(function(s){return s.value;});
    var minV = Math.min.apply(null, vals), maxV = Math.max.apply(null, vals);
    var range = maxV - minV || 1;

    // Sort so smaller circles draw on top
    var sorted = stores.slice().sort(function(a,b){return b.value - a.value;});

    for (var i = 0; i < sorted.length; i++) {
      var s = sorted[i];
      var p = project(s.lat, s.lng, w, h);
      var frac = (s.value - minV) / range;
      var r = Math.max(4, Math.min(18, 4 + frac * 14));
      var color = heatColor(frac);

      // Glow
      ctx.beginPath();
      ctx.arc(p.x, p.y, r + 4, 0, Math.PI * 2);
      ctx.fillStyle = color.replace('rgb', 'rgba').replace(')', ',0.15)');
      ctx.fill();

      // Circle
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.85;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }
  }

  // Tooltip on hover
  document.getElementById('map').addEventListener('mousemove', function(e) {
    var rect = canvas.getBoundingClientRect();
    var mx = (e.clientX - rect.left), my = (e.clientY - rect.top);
    var hit = null, minDist = 20;
    for (var i = 0; i < storeData.length; i++) {
      var p = project(storeData[i].lat, storeData[i].lng, lastW, lastH);
      var dx = p.x - mx, dy = p.y - my;
      var dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < minDist) { minDist = dist; hit = storeData[i]; }
    }
    if (hit) {
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY - 40) + 'px';
      tooltip.innerHTML = '<strong>' + (hit.name || 'Store') + '</strong><br>Revenue: $' + Math.round(hit.value).toLocaleString();
    } else {
      tooltip.style.display = 'none';
    }
  });
  document.getElementById('map').addEventListener('mouseleave', function() { tooltip.style.display = 'none'; });

  render(synth());

  var client = (window.SigmaPlugin && window.SigmaPlugin.client) || null;
  if (client) {
    client.config.configureEditorPanel([
      { name: 'source', type: 'element' },
      { name: 'lat', type: 'column', source: 'source', allowMultiple: false, label: 'Latitude' },
      { name: 'lng', type: 'column', source: 'source', allowMultiple: false, label: 'Longitude' },
      { name: 'value', type: 'column', source: 'source', allowMultiple: false, label: 'Revenue' },
      { name: 'label', type: 'column', source: 'source', allowMultiple: false, label: 'Store Name' }
    ]);
    var unsubData = null;
    client.config.subscribe(function (config) {
      var sourceId = config && config.source;
      if (unsubData) { unsubData(); unsubData = null; }
      if (!sourceId || !config.lat || !config.lng || !config.value) { render(synth()); return; }
      unsubData = client.elements.subscribeToElementData(sourceId, function (data) {
        try {
          var latC = data[config.lat], lngC = data[config.lng], valC = data[config.value];
          var lblC = config.label ? data[config.label] : null;
          if (!latC || !lngC || !valC) { render(synth()); return; }
          var stores = [];
          for (var i = 0; i < latC.length; i++) {
            var la = Number(latC[i]), lo = Number(lngC[i]), v = Number(valC[i]);
            if (isFinite(la) && isFinite(lo) && isFinite(v)) {
              stores.push({ lat: la, lng: lo, value: v, name: lblC ? String(lblC[i]) : '' });
            }
          }
          render(stores);
        } catch(e) { render(synth()); }
      });
    });
  }

  new ResizeObserver(function () {
    render(storeData.length ? storeData : synth());
  }).observe(document.getElementById('root'));
})();
</script>
</body>
</html>
