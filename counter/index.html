<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Animated Counter</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #root { box-sizing: border-box; width: 100%; height: 100%; display: flex;
    flex-direction: column; align-items: center; justify-content: center; padding: 12px; }
  #label { font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px;
    color: #3b82f6; margin-bottom: 6px; }
  #value { font-weight: 700; color: #ffffff; line-height: 1.1; font-variant-numeric: tabular-nums; }
  #sub { font-size: 12px; color: #64748b; margin-top: 6px; }
</style>
</head>
<body>
<div id="root">
  <div id="label">TOTAL PROFIT</div>
  <div id="value">$0</div>
  <div id="sub"></div>
</div>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/@sigmacomputing/plugin@1.2.0/dist/umd/sigmacomputing-plugin.umd.js"></script>
<script>
(function () {
  'use strict';

  function synth() { return { value: 1247893, label: 'TOTAL PROFIT', format: '$,.0f', sub: '' }; }

  function formatNum(n, fmt) {
    var num = Number(n);
    if (!isFinite(num)) return String(n);
    var f = (fmt || '').trim();
    if (f.indexOf('$') !== -1) {
      var dm = f.match(/\.(\d+)/);
      var dec = dm ? Number(dm[1]) : 0;
      var neg = num < 0;
      var abs = Math.abs(num).toFixed(dec).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return (neg ? '-$' : '$') + abs;
    }
    if (f.indexOf('%') !== -1) {
      var pm = f.match(/\.(\d+)/);
      return (num * 100).toFixed(pm ? Number(pm[1]) : 0) + '%';
    }
    if (f.indexOf(',') !== -1) {
      var fm = f.match(/\.(\d+)/);
      return num.toFixed(fm ? Number(fm[1]) : 0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }
    return num.toLocaleString();
  }

  var animId = null, currentDisplay = 0;

  function animateTo(target, fmt, duration) {
    if (animId) cancelAnimationFrame(animId);
    var start = currentDisplay, diff = target - start;
    duration = duration || 1400;
    var startTime = null;
    function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
    function step(ts) {
      if (!startTime) startTime = ts;
      var progress = Math.min((ts - startTime) / duration, 1);
      currentDisplay = start + diff * easeOut(progress);
      document.getElementById('value').textContent = formatNum(currentDisplay, fmt);
      if (progress < 1) animId = requestAnimationFrame(step);
    }
    animId = requestAnimationFrame(step);
  }

  function resize() {
    var root = document.getElementById('root');
    var box = root.getBoundingClientRect();
    var vSize = Math.max(18, Math.min(box.width * 0.15, box.height * 0.35));
    var lSize = Math.max(9, vSize * 0.3);
    document.getElementById('value').style.fontSize = vSize + 'px';
    document.getElementById('label').style.fontSize = lSize + 'px';
  }

  function render(value, label, fmt, labelColor, valueColor, sub) {
    document.getElementById('label').textContent = label || 'METRIC';
    document.getElementById('sub').textContent = sub || '';
    if (labelColor) document.getElementById('label').style.color = labelColor;
    if (valueColor) document.getElementById('value').style.color = valueColor;
    resize();
    animateTo(value, fmt);
  }

  var s = synth();
  currentDisplay = s.value;
  document.getElementById('value').textContent = formatNum(s.value, s.format);
  resize();

  var client = (window.SigmaPlugin && window.SigmaPlugin.client) || null;
  if (client) {
    client.config.configureEditorPanel([
      { name: 'source', type: 'element' },
      { name: 'value', type: 'column', source: 'source', allowMultiple: false },
      { name: 'label', type: 'text', defaultValue: 'TOTAL PROFIT', placeholder: 'Label text' },
      { name: 'format', type: 'text', defaultValue: '$,.0f', placeholder: 'e.g. $,.0f or ,.0f or .1%' },
      { name: 'subtitle', type: 'text', defaultValue: '', placeholder: 'Optional subtitle' },
      { name: 'labelColor', type: 'text', defaultValue: '#10B981', placeholder: 'Label hex color' },
      { name: 'valueColor', type: 'text', defaultValue: '#ffffff', placeholder: 'Value hex color' }
    ]);
    var unsubData = null;
    client.config.subscribe(function (config) {
      var sourceId = config && config.source;
      if (unsubData) { unsubData(); unsubData = null; }
      if (!sourceId || !config.value) {
        var fb = synth();
        render(fb.value, config && config.label || fb.label, config && config.format || fb.format,
          config && config.labelColor, config && config.valueColor, config && config.subtitle);
        return;
      }
      unsubData = client.elements.subscribeToElementData(sourceId, function (data) {
        try {
          var vc = data[config.value];
          if (vc && vc.length) {
            render(Number(vc[0]), config.label || 'METRIC', config.format || '$,.0f',
              config.labelColor, config.valueColor, config.subtitle);
          } else {
            var fb = synth();
            render(fb.value, config.label || fb.label, config.format || fb.format,
              config.labelColor, config.valueColor, config.subtitle);
          }
        } catch(e) { var fb = synth(); render(fb.value, fb.label, fb.format); }
      });
    });
  }

  new ResizeObserver(resize).observe(document.getElementById('root'));
})();
</script>
</body>
</html>
